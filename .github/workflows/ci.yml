name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (Node + MongoDB em memoria)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-8.0.16
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:integration

  portal:
    name: Portal (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/portal/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  flutter:
    name: Flutter (analyze + testes)
    # Windows: os goldens foram gerados em Windows.
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      # Os goldens exibem horarios via DateTime.toLocal() e foram gerados no
      # fuso do projeto (America/Sao_Paulo). O runner Windows usa UTC, o que
      # desloca "12:00" para "09:00" e quebra 14 comparacoes visuais.
      - name: Fixar fuso horario do runner (America/Sao_Paulo)
        shell: pwsh
        run: |
          tzutil /s "E. South America Standard Time"
          tzutil /g
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  java:
    name: Java (Maven verify)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: modules/java-monitoramento
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B clean verify
